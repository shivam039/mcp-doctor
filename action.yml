name: 'mcp-medic-action'
description: 'Diagnose broken MCP (Model Context Protocol) server configs in CI before they break your agent silently'
author: 'Shivam Dixit'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  config-path:
    description: 'Path to MCP configuration file (defaults to auto-discovery across project/.mcp.json)'
    required: false
    default: ''
  fail-on:
    description: 'Failure threshold: "error" (default) or "warning"'
    required: false
    default: 'error'
  show-fixes:
    description: 'Display actionable fix suggestions under diagnostics'
    required: false
    default: 'true'
  policy-path:
    description: 'Path to organizational policy JSON (.mcp-medic-policy.json)'
    required: false
    default: ''
  export-junit:
    description: 'Path to export JUnit XML report for CI test dashboards'
    required: false
    default: ''
  export-json:
    description: 'Path to export JSON diagnostics report'
    required: false
    default: ''
  snapshot:
    description: 'Path to baseline snapshot JSON to gate on regressions only'
    required: false
    default: ''
  timeout:
    description: 'Handshake timeout per server in milliseconds'
    required: false
    default: '5000'
  verbose:
    description: 'Output raw JSON-RPC traffic for debugging'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run mcp-medic
      shell: bash
      run: |
        ARGS="check"
        if [ -n "${{ inputs.config-path }}" ]; then
          ARGS="$ARGS ${{ inputs.config-path }}"
        fi
        if [ "${{ inputs.show-fixes }}" = "true" ]; then
          ARGS="$ARGS --show-fixes"
        fi
        if [ -n "${{ inputs.fail-on }}" ]; then
          ARGS="$ARGS --fail-on ${{ inputs.fail-on }}"
        fi
        if [ -n "${{ inputs.policy-path }}" ]; then
          ARGS="$ARGS --policy ${{ inputs.policy-path }}"
        fi
        if [ -n "${{ inputs.export-junit }}" ]; then
          ARGS="$ARGS --export-junit ${{ inputs.export-junit }}"
        fi
        if [ -n "${{ inputs.export-json }}" ]; then
          ARGS="$ARGS --export-json ${{ inputs.export-json }}"
        fi
        if [ -n "${{ inputs.snapshot }}" ]; then
          ARGS="$ARGS --snapshot ${{ inputs.snapshot }}"
        fi
        if [ -n "${{ inputs.timeout }}" ]; then
          ARGS="$ARGS --timeout ${{ inputs.timeout }}"
        fi
        if [ "${{ inputs.verbose }}" = "true" ]; then
          ARGS="$ARGS --verbose"
        fi
        npx --yes mcp-medic $ARGS
