name: Auto Release & Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Auto-Bump Version & Tag Release
        id: release
        run: node scripts/auto-release.js

      - name: Build Distribution
        run: npm run build

      - name: Verify Package Contents
        run: npm pack --dry-run

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [ -n "$VERSION" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes || echo "Release already exists"
          fi

      - name: Publish to NPM (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run completed successfully. Package is ready for publication."

      - name: Publish to NPM (Trusted Publisher OIDC)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm config set //registry.npmjs.org/:_authToken "${{ secrets.NPM_TOKEN }}"
          fi
          npm publish --access public --provenance
