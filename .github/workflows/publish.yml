name: Auto Release & Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC Trusted Publishing
        # Native tokenless "Trusted Publisher" OIDC publishing requires
        # npm >=11.5.1; the version bundled with actions/setup-node's
        # Node 22 is older than that, so upgrade explicitly.
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Auto-Bump Version & Tag Release
        id: release
        run: node scripts/auto-release.js

      - name: Build Distribution
        run: npm run build

      - name: Verify Package Contents
        run: npm pack --dry-run

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [ -n "$VERSION" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes || echo "Release already exists"
          fi

      - name: Publish to NPM (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run completed successfully. Package is ready for publication."

      - name: Publish to NPM (Trusted Publisher OIDC)
        # No NPM_TOKEN: npm's native OIDC Trusted Publishing exchanges this
        # job's GitHub Actions id-token (permissions.id-token: write, above)
        # for registry auth directly. This requires the mcp-medic package on
        # npmjs.com to have a Trusted Publisher configured for this exact
        # repo (shivam039/mcp-doctor) and workflow file (publish.yml) —
        # see npmjs.com package Settings -> Publishing access.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance
